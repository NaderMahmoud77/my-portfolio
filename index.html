<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/my-portfolio/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nader</title>
    <script type="module" crossorigin src="/my-portfolio/assets/index-DGbXPnwD.js"></script>
    <link rel="stylesheet" crossorigin href="/my-portfolio/assets/index-CIQ2u1y8.css">
  </head>
  <body class="overflow-x-hidden">
    <div id="app"></div>
    <script>
      let theme = localStorage.getItem("theme");
      if (!theme) {
        document.documentElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
      } else if (theme === "dark") {
        document.documentElement.classList.add("dark");
      } else if (theme === "light") {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </body>
</html>
